name: Verification baseline

on:
  push:
    branches:
      - fix/23-verification-baseline

permissions:
  contents: read
  issues: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 26.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run full repository check
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check > baseline-check.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish verification result
        if: always()
        uses: actions/github-script@v7
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
          CHECK_EXIT: ${{ steps.checks.outputs.exit_code }}
        with:
          script: |
            const fs = require('node:fs');
            const output = fs.existsSync('baseline-check.log') ? fs.readFileSync('baseline-check.log', 'utf8').trim() : '<log missing>';
            const tail = output.length > 50000 ? output.slice(-50000) : output;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: `## Final full verification matrix — ${process.env.MATRIX_OS} / Node ${process.env.MATRIX_NODE}\n\nHead: \`${context.sha}\`\nExit: \`${process.env.CHECK_EXIT || 'unknown'}\`\n\n<details><summary>npm run check output</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`
            });
            if ((process.env.CHECK_EXIT || '1') !== '0') core.setFailed(`npm run check exited ${process.env.CHECK_EXIT || 'unknown'}`);
