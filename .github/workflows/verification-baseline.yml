name: Verification baseline

on:
  push:
    branches:
      - fix/23-verification-baseline
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 26.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run tests and publish diagnostic output
        uses: actions/github-script@v7
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE: ${{ matrix.node }}
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const command = process.platform === 'win32' ? 'npm.cmd' : 'npm';
            const result = spawnSync(command, ['test'], { encoding: 'utf8' });
            const output = `${result.stdout ?? ''}\n${result.stderr ?? ''}`.trim();
            const tail = output.length > 50000 ? output.slice(-50000) : output;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: `## Baseline matrix diagnostic — ${process.env.MATRIX_OS} / Node ${process.env.MATRIX_NODE}\n\nExit: \`${result.status}\`\n\n<details><summary>npm test output</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`
            });
            if (result.status !== 0) core.setFailed(`npm test exited ${result.status}`);
