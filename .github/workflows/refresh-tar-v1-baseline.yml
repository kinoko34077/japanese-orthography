name: Refresh TAR final BrowserPack v1 baseline (temporary read-only)
on:
  push:
    branches:
      - migration/tar-candidate-290
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate v1 baseline with canonical generator
        run: npm run measure:browser-pack > /tmp/v1-baseline-generate.log
      - name: Export canonical generated file
        run: |
          echo __REPORT_BEGIN__:data/reports/browser-pack-v1-measurements.json
          base64 -w 0 data/reports/browser-pack-v1-measurements.json | fold -w 60000
          echo __REPORT_END__:data/reports/browser-pack-v1-measurements.json
