name: Refresh TAR candidate generated artifacts

on:
  push:
    branches:
      - migration/tar-candidate-290

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 生成物を更新
        run: |
          npm run generate:orthography-accounting
          npm run validate:orthography-accounting
          npm run generate:tar-runtime-parity
          npm run validate:tar-runtime-parity
      - name: 生成結果を保存
        uses: actions/upload-artifact@v4
        with:
          name: tar-candidate-generated
          path: |
            data/reports/orthography-v2-source-accounting.json
            data/reports/tar-runtime-parity.json
            data/reports/tar-runtime-parity-summary.json
          if-no-files-found: error
          retention-days: 1
