# JO Pilot caller — proposed scoped admission for devflow#415 / JO#300.
# Security review and separate Human merge gate required before activating.
# The replay acceptance mode is restricted to one fresh, isolated scratch PR
# branch; this proposal does not create that branch or execute the writer.
# No extra credentials, new permissions, or arbitrary shell commands.
name: Verified artifacts pilot (devflow#384)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Open same-repository PR branch under artifact/devflow384/
        type: string
        required: true
      expected_head:
        description: Exact current head SHA of target_branch
        type: string
        required: true
      mode:
        description: dry-run, write, or dedicated acceptance-only write-replay-test
        type: choice
        options: [dry-run, write, write-replay-test]
        default: dry-run

permissions: {}

concurrency:
  group: verified-artifacts-pilot-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  writeback:
    # Normal modes retain their previous accepted scope. Replay is for one
    # newly isolated scratch branch; never use an older Pilot branch or #301.
    if: ${{ inputs.mode != 'write-replay-test' || inputs.target_branch == 'artifact/devflow384/replay-415-s36' }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: kinoko34077/devflow/.github/workflows/generated-artifact-writeback.yml@f886877e7110f2499125ecc6e07294798c33fe93
    with:
      devflow_sha: f886877e7110f2499125ecc6e07294798c33fe93
      target_branch: ${{ inputs.target_branch }}
      expected_head: ${{ inputs.expected_head }}
      mode: ${{ inputs.mode }}
