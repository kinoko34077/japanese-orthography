name: Refresh TAR candidate measurements (temporary read-only)

on:
  push:
    branches:
      - migration/tar-candidate-290

permissions:
  contents: read

jobs:
  measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate directly affected measurement reports
        run: |
          npm run measure:pack-payload
          npm run measure:pack-payload -- --v3
          npm run measure:sequence-encoding
          npm run measure:browser-capability -- --v2 --v3
      - name: Export only changed measurement reports
        shell: bash
        run: |
          git diff --name-only -z -- data/reports/ > /tmp/measurement-changes
          while IFS= read -r -d '' file; do
            echo "__MEASURE_BEGIN__:$file"
            base64 -w 0 "$file" | fold -w 60000
            echo "__MEASURE_END__:$file"
          done < /tmp/measurement-changes
