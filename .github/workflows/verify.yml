name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Phase 4.6D native kana artifacts
        run: npm run generate:native-kana
      - name: Upload Phase 4.6D generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase46d-native-kana-generated
          path: |
            data/intake/phase46d-native-kana.json
            data/reports/phase46d-native-kana-coverage.json
      - run: npm run check
