name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Phase 4.6D native artifacts
        run: |
          npm run generate:native-kana
          node --import tsx tools/native-kana-compiler.ts
      - name: Upload Phase 4.6D regenerated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase46d-dictionary-note-generated
          path: |
            data/intake/phase46d-native-kana.json
            data/reports/phase46d-native-kana-coverage.json
            data/historical/native/phase46d-native-kana.json
      - run: npm run check
