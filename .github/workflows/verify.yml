name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the static site (dist-site/, not published)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:site
      - name: Verify closed TAR origin against generated Pack (not published)
        if: matrix.os == 'ubuntu-latest'
        run: node --import tsx tools/verify-tar-closed-origin-site.ts
      - name: Verify generated fixed TAR origin index (not published)
        if: matrix.os == 'ubuntu-latest'
        run: node --import tsx tools/verify-tar-browser-origin-index-site.ts
      - name: Verify pinned browser TAR origin closure (not published)
        if: matrix.os == 'ubuntu-latest'
        run: node --import tsx tools/verify-tar-browser-closed-origin-site.ts
      - name: Verify read-only Worker diagnostic opt-in (not published)
        if: matrix.os == 'ubuntu-latest'
        run: node --import tsx tools/verify-tar-worker-readonly-optin-site.ts
