name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the static site (dist-site/, not published)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:site

  pilot-head:
    # Read-only, exact-commit verification for the isolated writeback acceptance PR.
    # Keep the existing check matrix (PR merge-tree verification) unchanged.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'artifact/devflow384/replay-415-s36' && github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify the exact PR HEAD commit was checked out
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the static site (dist-site/, not published)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:site
