name: Transfer TAR candidate derived artifacts (temporary read-only)

on:
  push:
    branches:
      - migration/tar-candidate-290

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate only outstanding canonical files
        run: |
          npm run generate:orthography-v2-bundle
          npm run generate:tar-parity
      - name: Emit canonical files for connector transfer
        shell: bash
        run: |
          for file in \
            data/runtime/orthography-v2-bundle-section.json \
            data/reports/tar-parity-diff.json
          do
            echo "__GEN_BEGIN__:$file"
            base64 -w 0 "$file" | fold -w 60000
            echo "__GEN_END__:$file"
          done
