name: Refresh TAR pattern generated evidence (temporary controlled write)

on:
  push:
    branches:
      - migration/tar-pattern-291

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate canonical registry, graph and compilation reports
        run: |
          npm run generate:symbol-registry
          npm run generate:orthography-accounting
          npm run generate:orthography-v2-bundle
          npm run generate:rule-ir
          npm run generate:rule-programs
      - name: Generate native BrowserPack and runtime parity reports
        run: |
          npm run generate:browser-pack
          npm run generate:tar-parity
          npm run generate:tar-runtime-parity
      - name: Regenerate measurements affected by pattern rule addition
        run: |
          npm run measure:orthography-v2
          npm run measure:browser-pack
          npm run measure:browser-pack-v2
          npm run measure:browser-pack-v2 -- --v3
          npm run measure:browser-capability
          npm run measure:browser-capability -- --v2
          npm run measure:browser-capability -- --v3
          npm run measure:browser-ruby
          npm run measure:pack-payload
          npm run measure:sequence-encoding
          npm run measure:browser-rule-program
      - name: Run full local acceptance on generated checkout
        run: npm run check
      - name: Export generated changed files (no write to repo)
        if: always()
        shell: bash
        run: |
          git status --short
          git diff --name-only -- data | tee /tmp/tar-pattern-changed.txt
          if [ -s /tmp/tar-pattern-changed.txt ]; then
            tar -czf /tmp/tar-pattern-generated.tar.gz -T /tmp/tar-pattern-changed.txt
          else
            tar -czf /tmp/tar-pattern-generated.tar.gz --files-from /dev/null
          fi
          echo "TAR_PATTERN_ARCHIVE_BYTES=$(wc -c </tmp/tar-pattern-generated.tar.gz)"
      - name: Upload changed file manifest and archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tar-pattern-generated-evidence
          path: |
            /tmp/tar-pattern-changed.txt
            /tmp/tar-pattern-generated.tar.gz
          retention-days: 2
      - name: Commit the 26 verified generated artifacts only
        if: success() && github.ref == 'refs/heads/migration/tar-pattern-291'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/migration/tar-pattern-291'
          git diff --name-only -- data | LC_ALL=C sort > /tmp/tar-pattern-actual.txt
          cat > /tmp/tar-pattern-expected.txt <<'EXPECTED'
          data/browser-pack-v2/manifest.json
          data/browser-pack-v3/manifest.json
          data/browser-pack/manifest.json
          data/reports/browser-capability-utilization-v1.json
          data/reports/browser-capability-utilization-v2.json
          data/reports/browser-capability-utilization-v3.json
          data/reports/browser-pack-v1-compiled.json
          data/reports/browser-pack-v1-measurements.json
          data/reports/browser-pack-v2-compiled.json
          data/reports/browser-pack-v2-measurements.json
          data/reports/browser-pack-v2-payload-decomposition.json
          data/reports/browser-pack-v3-compiled.json
          data/reports/browser-pack-v3-measurements.json
          data/reports/browser-resolver-parity-v3.json
          data/reports/browser-resolver-parity.json
          data/reports/browser-ruby-acceptance.json
          data/reports/orthography-v2-measurements.json
          data/reports/orthography-v2-source-accounting.json
          data/reports/rule-ir-summary.json
          data/reports/rule-program-summary.json
          data/reports/symbol-sequence-encoding.json
          data/reports/tar-parity-diff.json
          data/reports/tar-parity-summary.json
          data/reports/tar-runtime-parity-summary.json
          data/reports/tar-runtime-parity.json
          data/runtime/orthography-v2-bundle-section.json
          EXPECTED
          sed -i 's/^          //' /tmp/tar-pattern-expected.txt
          LC_ALL=C sort -o /tmp/tar-pattern-expected.txt /tmp/tar-pattern-expected.txt
          cmp /tmp/tar-pattern-expected.txt /tmp/tar-pattern-actual.txt
          while IFS= read -r generated; do
            git add -- "$generated"
          done < /tmp/tar-pattern-expected.txt
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort | cmp /tmp/tar-pattern-expected.txt -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'TAR pattern検証済み生成物26件を正規反映'
          git push origin HEAD:refs/heads/migration/tar-pattern-291
